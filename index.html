<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindfulClass | Classroom Focus & Breathing Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .mono { font-family: 'JetBrains+Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 selection:bg-teal-500 selection:text-slate-950">

  <header class="w-full max-w-2xl flex items-center justify-between border-b border-slate-800 pb-4">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400">
        <i class="fa-solid fa-wind"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white">MindfulClass</h1>
        <p class="text-[11px] text-slate-400">Classroom Focus & Regulation Companion</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="audioToggle" onclick="toggleAudio()" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900 text-xs font-semibold text-slate-300 hover:border-teal-500/50 hover:text-teal-300 transition flex items-center gap-2">
        <i id="audioIcon" class="fa-solid fa-volume-xmark text-slate-400"></i>
        <span id="audioText">Ambient Audio</span>
      </button>
    </div>
  </header>

  <main class="w-full max-w-md flex flex-col items-center my-auto py-8">
    <div class="flex bg-slate-900 border border-slate-800 p-1 rounded-xl mb-10 text-xs font-medium w-full max-w-sm justify-between shadow-inner">
      <button onclick="setMode('box')" id="btn-box" class="mode-btn flex-1 py-2 rounded-lg bg-teal-500 text-slate-950 font-bold transition">Box 4-4-4-4</button>
      <button onclick="setMode('calm')" id="btn-calm" class="mode-btn flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Calm 4-7-8</button>
      <button onclick="setMode('focus')" id="btn-focus" class="mode-btn flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Quick Focus</button>
    </div>

    <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
      <div id="outerRing" class="absolute inset-0 rounded-full bg-teal-500/5 border border-teal-500/20 transition-all duration-1000 scale-100"></div>
      <div id="innerOrb" class="w-40 h-40 rounded-full bg-gradient-to-tr from-teal-500/40 to-cyan-400/20 border border-teal-400/40 flex flex-col items-center justify-center backdrop-blur-md shadow-lg shadow-teal-500/10 transition-transform duration-1000 ease-in-out scale-90">
        <span id="instructionText" class="text-sm font-bold uppercase tracking-wider text-teal-200">Ready</span>
        <span id="timerCountdown" class="mono text-3xl font-extrabold text-white mt-1">4</span>
      </div>
    </div>

    <p id="routineDesc" class="text-xs text-slate-400 text-center mt-8 max-w-xs leading-relaxed">
      Box Breathing regulates nervous system responses before exams or quiet study sessions.
    </p>

    <div class="flex items-center gap-4 mt-8">
      <button id="startBtn" onclick="toggleExercise()" class="px-8 py-3 rounded-xl bg-teal-400 hover:bg-teal-300 text-slate-950 font-bold text-sm shadow-lg shadow-teal-500/20 transition flex items-center gap-2">
        <i class="fa-solid fa-play"></i> Start Session
      </button>
      <button onclick="resetExercise()" class="px-4 py-3 rounded-xl border border-slate-700 bg-slate-900 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
    </div>
  </main>

  <footer class="w-full max-w-2xl bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400">
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-teal-500/10 text-teal-400 font-bold">
        <i class="fa-solid fa-check"></i>
      </span>
      <span>Completed Cycles: <strong id="completedCount" class="text-white font-mono">0</strong></span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-[11px] text-slate-500">Student Regulation Tech • HTML5 / Web Audio API</span>
    </div>
  </footer>

  <script>
    const modes = {
      box: {
        name: "Box 4-4-4-4",
        desc: "Equal duration inhale, hold, exhale, and hold. Excellent for nervous system balance.",
        steps: [
          { text: "Inhale", duration: 4, scale: 1.35 },
          { text: "Hold", duration: 4, scale: 1.35 },
          { text: "Exhale", duration: 4, scale: 0.85 },
          { text: "Hold", duration: 4, scale: 0.85 }
        ]
      },
      calm: {
        name: "Calm 4-7-8",
        desc: "Extended exhalation stimulates the vagus nerve to reduce classroom stress.",
        steps: [
          { text: "Inhale", duration: 4, scale: 1.4 },
          { text: "Hold", duration: 7, scale: 1.4 },
          { text: "Exhale", duration: 8, scale: 0.8 }
        ]
      },
      focus: {
        name: "Quick Focus",
        desc: "Energizing rhythm designed to reset attention between study periods.",
        steps: [
          { text: "Inhale", duration: 3, scale: 1.25 },
          { text: "Exhale", duration: 3, scale: 0.9 }
        ]
      }
    };

    let currentMode = 'box';
    let isRunning = false;
    let stepIndex = 0;
    let countdown = 4;
    let intervalId = null;
    let completedCycles = 0;
    let audioCtx = null;
    let soundEnabled = false;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, type = 'sine', duration = 0.6) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    function toggleAudio() {
      initAudio();
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('audioIcon');
      const text = document.getElementById('audioText');
      if (soundEnabled) {
        icon.className = "fa-solid fa-volume-high text-teal-400";
        text.innerText = "Audio Active";
        playTone(520, 'sine', 0.4);
      } else {
        icon.className = "fa-solid fa-volume-xmark text-slate-400";
        text.innerText = "Ambient Audio";
      }
    }

    function setMode(modeKey) {
      if (isRunning) resetExercise();
      currentMode = modeKey;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.className = "mode-btn flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition";
      });
      document.getElementById(`btn-${modeKey}`).className = "mode-btn flex-1 py-2 rounded-lg bg-teal-500 text-slate-950 font-bold transition";
      document.getElementById('routineDesc').innerText = modes[modeKey].desc;
      resetExercise();
    }

    function toggleExercise() {
      if (isRunning) pauseExercise();
      else startExercise();
    }

    function startExercise() {
      initAudio();
      isRunning = true;
      document.getElementById('startBtn').innerHTML = `<i class="fa-solid fa-pause"></i> Pause`;
      runStep();
      intervalId = setInterval(tick, 1000);
    }

    function pauseExercise() {
      isRunning = false;
      clearInterval(intervalId);
      document.getElementById('startBtn').innerHTML = `<i class="fa-solid fa-play"></i> Resume`;
    }

    function resetExercise() {
      clearInterval(intervalId);
      isRunning = false;
      stepIndex = 0;
      const currentRoutine = modes[currentMode];
      countdown = currentRoutine.steps[0].duration;
      document.getElementById('startBtn').innerHTML = `<i class="fa-solid fa-play"></i> Start Session`;
      document.getElementById('instructionText').innerText = "Ready";
      document.getElementById('timerCountdown').innerText = countdown;
      const orb = document.getElementById('innerOrb');
      orb.style.transitionDuration = '500ms';
      orb.style.transform = 'scale(0.9)';
    }

    function runStep() {
      const routine = modes[currentMode];
      const step = routine.steps[stepIndex];
      countdown = step.duration;
      const orb = document.getElementById('innerOrb');
      const outer = document.getElementById('outerRing');
      orb.style.transitionDuration = `${step.duration}s`;
      orb.style.transform = `scale(${step.scale})`;
      outer.style.transform = `scale(${step.scale * 1.05})`;
      document.getElementById('instructionText').innerText = step.text;
      document.getElementById('timerCountdown').innerText = countdown;

      if (step.text === "Inhale") playTone(440, 'triangle', 0.5);
      if (step.text === "Exhale") playTone(330, 'sine', 0.5);
    }

    function tick() {
      countdown--;
      if (countdown > 0) {
        document.getElementById('timerCountdown').innerText = countdown;
      } else {
        stepIndex++;
        const routine = modes[currentMode];
        if (stepIndex >= routine.steps.length) {
          stepIndex = 0;
          completedCycles++;
          document.getElementById('completedCount').innerText = completedCycles;
          playTone(660, 'sine', 0.8);
        }
        runStep();
      }
    }
  </script>
</body>
</html>
